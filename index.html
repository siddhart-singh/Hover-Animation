<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Silver.Stone — Long Press Menu</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #e7e1d5;
    color: #111;
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
  }

  .page {
    width: min(1100px, 92vw);
  }

  .title {
    border-top: 3px solid #111;
    border-bottom: 1px solid #111;
    padding: 12px 0;
    margin-bottom: 24px;
    text-transform: uppercase;
    letter-spacing: -1px;
    font-size: clamp(28px, 5vw, 56px);
    text-align: center;
  }

  .product {
    width: min(370px, 85vw);
    margin: auto;
    position: relative;
    cursor: grab;
    user-select: none;
    touch-action: none;

    background: #eee8dc;
    border: 1px solid #181818;
    padding: 10px;

    transition:
      transform 240ms cubic-bezier(.2,.8,.2,1),
      box-shadow 240ms ease,
      filter 240ms ease;
  }

  .product img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    pointer-events: none;
    filter: grayscale(20%) contrast(1.05);
  }

  .product-info {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 14px 3px 4px;
    border-top: 1px solid #111;
    margin-top: 10px;
  }

  .product-name {
    font-size: 21px;
  }

  .product-price {
    font-size: 15px;
    white-space: nowrap;
  }

  .product.pressing {
    transform: scale(0.985);
  }

  .product.menu-open {
    transform: scale(1.035) rotate(-0.35deg);
    box-shadow:
      0 18px 30px rgba(0,0,0,.17),
      7px 7px 0 rgba(0,0,0,.06);
    z-index: 20;
  }

  /* -----------------------------------
     BACKDROP
  ----------------------------------- */

  .backdrop {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: rgba(32, 28, 21, .15);
    backdrop-filter: blur(1.5px);

    transition: opacity 180ms ease;
    z-index: 10;
  }

  .backdrop.show {
    opacity: 1;
  }

  /* -----------------------------------
     RADIAL MENU
  ----------------------------------- */

  .radial-menu {
    position: fixed;
    left: 0;
    top: 0;

    width: 1px;
    height: 1px;

    z-index: 100;
    pointer-events: none;
  }

  .menu-item {
    --x: 0px;
    --y: 0px;

    position: absolute;
    width: 74px;
    height: 74px;

    left: -37px;
    top: -37px;

    display: grid;
    place-items: center;

    text-align: center;
    font-size: 11px;
    line-height: 1.05;
    text-transform: uppercase;
    letter-spacing: .6px;

    background: #f5efe3;
    color: #111;

    border: 1.7px solid #111;

    /* intentionally imperfect paper cutout */
    border-radius: 51% 44% 48% 46% / 44% 52% 45% 54%;

    opacity: 0;

    transform:
      translate(0,0)
      scale(.25)
      rotate(-10deg);

    transition:
      transform 340ms cubic-bezier(.22,1.4,.36,1),
      opacity 130ms ease,
      background 120ms ease,
      color 120ms ease;

    box-shadow: 3px 4px 0 rgba(0,0,0,.15);
  }

  .radial-menu.open .menu-item {
    opacity: 1;

    transform:
      translate(var(--x), var(--y))
      scale(1)
      rotate(var(--rotation));
  }

  .menu-item:nth-child(1) {
    transition-delay: 0ms;
  }

  .menu-item:nth-child(2) {
    transition-delay: 30ms;
  }

  .menu-item:nth-child(3) {
    transition-delay: 60ms;
  }

  .menu-item:nth-child(4) {
    transition-delay: 90ms;
  }

  .menu-item.active {
    background: #151515;
    color: #f5efe3;

    transform:
      translate(var(--x), var(--y))
      scale(1.17)
      rotate(var(--rotation)) !important;

    box-shadow:
      5px 6px 0 rgba(0,0,0,.15),
      inset 0 0 0 2px #f5efe3;
  }

  /* centre touch marker */

  .origin {
    position: absolute;
    width: 22px;
    height: 22px;

    left: -11px;
    top: -11px;

    border: 1px solid rgba(0,0,0,.5);
    border-radius: 50%;

    opacity: 0;

    transform: scale(.4);

    transition:
      opacity 150ms ease,
      transform 250ms ease;
  }

  .radial-menu.open .origin {
    opacity: .35;
    transform: scale(1);
  }

  .hint {
    margin-top: 25px;
    text-align: center;
    font-size: 13px;
    font-style: italic;
    opacity: .65;
  }

  .result {
    height: 24px;
    margin-top: 13px;
    text-align: center;
    font-size: 14px;
  }
</style>
</head>

<body>

<div class="backdrop" id="backdrop"></div>

<main class="page">

  <div class="title">
    Silver.Stone
  </div>

  <article class="product" id="product">

    <!-- Replace with your jewellery image -->
    <img
      src="https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=900&q=85"
      alt="Jewellery"
      draggable="false"
    />

    <div class="product-info">
      <div class="product-name">
        Blue Topaz<br>
        Signet
      </div>

      <div class="product-price">
        ₹12,500
      </div>
    </div>

  </article>

  <div class="hint">
    Click and hold / long press the jewellery.
  </div>

  <div class="result" id="result"></div>

</main>


<div class="radial-menu" id="menu">

  <div class="origin"></div>

  <div
    class="menu-item"
    data-action="Wishlist"
    style="
      --x: -100px;
      --y: -80px;
      --rotation: -5deg;
    "
  >
    ♡<br>Wishlist
  </div>

  <div
    class="menu-item"
    data-action="Quick View"
    style="
      --x: 0px;
      --y: -120px;
      --rotation: 3deg;
    "
  >
    ◉<br>Quick<br>View
  </div>

  <div
    class="menu-item"
    data-action="Share"
    style="
      --x: 100px;
      --y: -80px;
      --rotation: 6deg;
    "
  >
    ↗<br>Share
  </div>

  <div
    class="menu-item"
    data-action="View Piece"
    style="
      --x: 110px;
      --y: 25px;
      --rotation: -3deg;
    "
  >
    →<br>View<br>Piece
  </div>

</div>


<script>
const product  = document.querySelector("#product");
const menu     = document.querySelector("#menu");
const backdrop = document.querySelector("#backdrop");
const result   = document.querySelector("#result");
const items    = [...document.querySelectorAll(".menu-item")];

const LONG_PRESS_TIME = 300;
const CANCEL_DISTANCE = 12;
const HIT_RADIUS = 46;

let pressTimer;
let startX = 0;
let startY = 0;

let menuX = 0;
let menuY = 0;

let menuOpen = false;
let activeItem = null;
let pointerId = null;


/* ----------------------------------------
   START PRESS
----------------------------------------- */

product.addEventListener("pointerdown", (event) => {

  if (event.button !== undefined && event.button !== 0)
    return;

  pointerId = event.pointerId;

  startX = event.clientX;
  startY = event.clientY;

  product.classList.add("pressing");

  product.setPointerCapture(pointerId);

  pressTimer = setTimeout(() => {
    openMenu(startX, startY);
  }, LONG_PRESS_TIME);
});


/* ----------------------------------------
   POINTER MOVEMENT
----------------------------------------- */

product.addEventListener("pointermove", (event) => {

  const dx = event.clientX - startX;
  const dy = event.clientY - startY;

  const distance = Math.hypot(dx, dy);

  /*
    Before menu opens:
    moving too far means the user probably
    intended to scroll rather than long press.
  */

  if (!menuOpen) {

    if (distance > CANCEL_DISTANCE) {
      cancelLongPress();
    }

    return;
  }

  updateSelection(
    event.clientX,
    event.clientY
  );
});


/* ----------------------------------------
   RELEASE
----------------------------------------- */

product.addEventListener("pointerup", (event) => {

  clearTimeout(pressTimer);

  product.classList.remove("pressing");

  if (menuOpen) {

    updateSelection(
      event.clientX,
      event.clientY
    );

    if (activeItem) {

      const action =
        activeItem.dataset.action;

      result.textContent =
        `Selected: ${action}`;

      console.log(
        "Silver.Stone action:",
        action
      );

      /*
        Hook real actions here:

        Wishlist    → addWishlist()
        Quick View  → openQuickView()
        Share       → navigator.share()
        View Piece  → navigate()
      */
    }

    closeMenu();
  }
});


product.addEventListener(
  "pointercancel",
  closeMenu
);


/* ----------------------------------------
   OPEN MENU
----------------------------------------- */

function openMenu(x, y) {

  menuOpen = true;

  /*
    Basic edge awareness.

    If near right edge, move menu origin left.
    If near top edge, move menu down.
  */

  const padding = 140;

  menuX = Math.min(
    Math.max(x, padding),
    window.innerWidth - padding
  );

  menuY = Math.min(
    Math.max(y, padding),
    window.innerHeight - padding
  );

  menu.style.left = `${menuX}px`;
  menu.style.top  = `${menuY}px`;

  product.classList.remove("pressing");
  product.classList.add("menu-open");

  backdrop.classList.add("show");
  menu.classList.add("open");


  /*
    Short vibration on supported phones.
  */

  if (navigator.vibrate) {
    navigator.vibrate(12);
  }
}


/* ----------------------------------------
   FIND CLOSEST ACTION
----------------------------------------- */

function updateSelection(pointerX, pointerY) {

  let closest = null;
  let closestDistance = Infinity;

  const menuRect =
    menu.getBoundingClientRect();

  items.forEach(item => {

    const rect =
      item.getBoundingClientRect();

    const centerX =
      rect.left + rect.width / 2;

    const centerY =
      rect.top + rect.height / 2;

    const distance = Math.hypot(
      pointerX - centerX,
      pointerY - centerY
    );

    if (
      distance < HIT_RADIUS &&
      distance < closestDistance
    ) {
      closest = item;
      closestDistance = distance;
    }
  });


  if (closest === activeItem)
    return;


  items.forEach(item =>
    item.classList.remove("active")
  );


  activeItem = closest;


  if (activeItem) {

    activeItem.classList.add("active");

    if (navigator.vibrate) {
      navigator.vibrate(7);
    }
  }
}


/* ----------------------------------------
   CLOSE MENU
----------------------------------------- */

function closeMenu() {

  clearTimeout(pressTimer);

  menuOpen = false;

  product.classList.remove(
    "pressing",
    "menu-open"
  );

  menu.classList.remove("open");
  backdrop.classList.remove("show");

  items.forEach(item =>
    item.classList.remove("active")
  );

  activeItem = null;
}


/* ----------------------------------------
   CANCEL BEFORE LONG PRESS
----------------------------------------- */

function cancelLongPress() {

  clearTimeout(pressTimer);

  product.classList.remove("pressing");
}

document
  .querySelector(".product")
  .addEventListener(
    "click",
    () => {

      result.textContent =
        "Open product page";

    }
  );
 
 document
  .querySelector(".product")
  .addEventListener(
    "hover",
    () => {

      result.textContent =
        "Open product page";

    }
  );
</script>

</body>
</html>
