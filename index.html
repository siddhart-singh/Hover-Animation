<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Silver.Stone Product Card Demo</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #e9e2d6;
    color: #111;
    font-family: Georgia, "Times New Roman", serif;
    padding: 40px 20px;
  }

  .page {
    width: min(1100px, 100%);
  }

  .masthead {
    border-top: 3px solid #111;
    border-bottom: 1px solid #111;
    padding: 12px 0;
    margin-bottom: 44px;
    text-align: center;
    font-size: clamp(32px, 5vw, 62px);
    letter-spacing: -1px;
    text-transform: uppercase;
  }

  .product-wrap {
    width: min(380px, 88vw);
    margin: auto;
    position: relative;
    padding-bottom: 62px;
  }

  .product-card {
    position: relative;
    z-index: 10;
    border: 1px solid #111;
    background: #f1ebdf;
    overflow: hidden;
    transition:
      transform 280ms cubic-bezier(.22, 1, .36, 1),
      box-shadow 280ms ease;
  }

  .product-wrap.menu-open .product-card {
    transform: translateY(-4px) rotate(-0.2deg);
    box-shadow: 0 18px 34px rgba(0,0,0,.14);
  }

  .image-stage {
    position: relative;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: #fff;
  }

  .image-stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition:
      opacity 420ms ease,
      transform 650ms cubic-bezier(.22, 1, .36, 1);
  }

  .model-image {
    opacity: 1;
    transform: scale(1);
    z-index: 1;
  }

  .product-image {
    opacity: 0;
    transform: scale(1.035);
    z-index: 2;
    object-fit: cover;
    background: white;
  }

  .product-card:hover .model-image {
    opacity: 0;
    transform: scale(1.03);
  }

  .product-card:hover .product-image {
    opacity: 1;
    transform: scale(1);
  }

  .view-label {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 5;
    border: 1px solid #111;
    background: rgba(246,240,229,.92);
    padding: 7px 10px;
    font-size: 11px;
    letter-spacing: .8px;
    text-transform: uppercase;
    transition: background 200ms ease, color 200ms ease;
  }

  .view-label .product-text {
    display: none;
  }

  .product-card:hover .view-label {
    background: #111;
    color: #f6f0e5;
  }

  .product-card:hover .view-label .model-text {
    display: none;
  }

  .product-card:hover .view-label .product-text {
    display: inline;
  }

  .product-info {
    border-top: 1px solid #111;
    padding: 15px 14px 16px;
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: flex-start;
  }

  .name {
    font-size: 22px;
    line-height: 1.05;
  }

  .meta {
    margin-top: 5px;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: .7;
  }

  .price {
    font-size: 14px;
    white-space: nowrap;
  }

  .menu-button {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 108px;
    height: 44px;
    z-index: 50;
    border: 1.5px solid #111;
    background: #f5efe4;
    color: #111;
    font: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 49% 51% 45% 55% / 55% 47% 53% 45%;
    box-shadow: 3px 4px 0 rgba(0,0,0,.14);
    transition:
      transform 180ms ease,
      background 180ms ease,
      color 180ms ease;
  }

  .menu-button:hover {
    transform: translateX(-50%) scale(1.05);
  }

  .product-wrap.menu-open .menu-button {
    background: #111;
    color: #f5efe4;
  }

  .action {
    position: absolute;
    left: 50%;
    bottom: 18px;
    width: 76px;
    height: 76px;
    margin-left: -38px;
    display: grid;
    place-items: center;
    text-align: center;
    z-index: 30;

    border: 1.5px solid #111;
    background: #f5efe4;
    color: #111;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10px;
    line-height: 1.1;
    letter-spacing: .5px;
    text-transform: uppercase;
    cursor: pointer;

    border-radius: 50% 45% 52% 48% / 46% 55% 45% 54%;
    box-shadow: 3px 4px 0 rgba(0,0,0,.13);

    opacity: 0;
    pointer-events: none;
    transform: translate(0,0) scale(.25) rotate(-8deg);

    transition:
      transform 400ms cubic-bezier(.2, 1.45, .3, 1),
      opacity 150ms ease,
      background 150ms ease,
      color 150ms ease;
  }

  .product-wrap.menu-open .action {
    opacity: 1;
    pointer-events: auto;
  }

  .product-wrap.menu-open .wishlist {
    transform: translate(-135px, -82px) rotate(-7deg);
  }

  .product-wrap.menu-open .quickview {
    transform: translate(-46px, -143px) rotate(3deg);
  }

  .product-wrap.menu-open .share {
    transform: translate(58px, -143px) rotate(-3deg);
  }

  .product-wrap.menu-open .view {
    transform: translate(140px, -82px) rotate(6deg);
  }

  .wishlist { transition-delay: 0ms; }
  .quickview { transition-delay: 35ms; }
  .share { transition-delay: 70ms; }
  .view { transition-delay: 105ms; }

  .action:hover {
    background: #111;
    color: #f5efe4;
    z-index: 60;
  }

  .product-wrap.menu-open .wishlist:hover {
    transform: translate(-135px, -82px) rotate(-2deg) scale(1.14);
  }

  .product-wrap.menu-open .quickview:hover {
    transform: translate(-46px, -143px) rotate(-2deg) scale(1.14);
  }

  .product-wrap.menu-open .share:hover {
    transform: translate(58px, -143px) rotate(2deg) scale(1.14);
  }

  .product-wrap.menu-open .view:hover {
    transform: translate(140px, -82px) rotate(2deg) scale(1.14);
  }

  .hint {
    margin-top: 26px;
    text-align: center;
    font-size: 12px;
    font-style: italic;
    opacity: .62;
  }

  .result {
    height: 20px;
    margin-top: 10px;
    text-align: center;
    font-size: 13px;
  }

  @media (max-width: 620px) {
    .product-wrap.menu-open .wishlist {
      transform: translate(-100px, -85px) rotate(-7deg);
    }

    .product-wrap.menu-open .quickview {
      transform: translate(-35px, -145px) rotate(3deg);
    }

    .product-wrap.menu-open .share {
      transform: translate(40px, -145px) rotate(-3deg);
    }

    .product-wrap.menu-open .view {
      transform: translate(105px, -85px) rotate(6deg);
    }
  }
</style>
</head>

  </main>

<script>
  const wrapper = document.querySelector("#productWrap");
  const menuButton = document.querySelector("#menuButton");
  const actions = document.querySelectorAll(".action");
  const result = document.querySelector("#result");

  function setMenu(open) {
    wrapper.classList.toggle("menu-open", open);
    menuButton.textContent = open ? "Close ×" : "Menu +";
    menuButton.setAttribute("aria-expanded", String(open));
  }

  menuButton.addEventListener("click", (event) => {
    event.stopPropagation();
    setMenu(!wrapper.classList.contains("menu-open"));
  });

  actions.forEach(action => {
    action.addEventListener("click", (event) => {
      event.stopPropagation();
      result.textContent = "Selected: " + action.dataset.action;
      setMenu(false);
    });
  });

  document.addEventListener("click", (event) => {
    if (!wrapper.contains(event.target)) setMenu(false);
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") setMenu(false);
  });
</script>
