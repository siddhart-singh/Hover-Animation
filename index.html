<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Silver.Stone — Product Menu</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #e7e1d5;
    color: #111;
    font-family: Georgia, "Times New Roman", serif;
  }

  .page {
    width: min(1100px, 92vw);
  }

  .title {
    border-top: 3px solid #111;
    border-bottom: 1px solid #111;
    padding: 12px 0;
    margin-bottom: 40px;
    text-align: center;
    text-transform: uppercase;
    font-size: clamp(30px, 5vw, 56px);
  }

  /* PRODUCT AREA */

  .product-wrap {
    width: min(370px, 85vw);
    margin: auto;
    position: relative;
    padding-bottom: 55px;
  }

  .product {
    position: relative;
    z-index: 10;

    background: #eee8dc;
    border: 1px solid #111;
    padding: 10px;

    transition:
      transform 300ms cubic-bezier(.22, 1, .36, 1),
      box-shadow 300ms ease;
  }

  .product img {
    width: 100%;
    display: block;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    filter: grayscale(15%) contrast(1.05);
  }

  .product-info {
    display: flex;
    justify-content: space-between;
    gap: 20px;

    border-top: 1px solid #111;

    margin-top: 10px;
    padding: 14px 3px 4px;
  }

  .product-name {
    font-size: 21px;
  }

  .product-price {
    font-size: 14px;
    white-space: nowrap;
  }


  /* PRODUCT LIFT WHEN MENU IS OPEN */

  .product-wrap.active .product {
    transform:
      translateY(-5px)
      scale(1.02)
      rotate(-0.25deg);

    box-shadow:
      0 18px 30px rgba(0,0,0,.15),
      6px 7px 0 rgba(0,0,0,.05);
  }


  /* MENU BUTTON */

  .menu-button {
    position: absolute;

    bottom: 0;
    left: 50%;

    transform: translateX(-50%);

    width: 100px;
    height: 44px;

    z-index: 50;

    border: 1.7px solid #111;

    background: #f3ede1;
    color: #111;

    font-family: Georgia, serif;
    font-size: 12px;

    text-transform: uppercase;
    letter-spacing: 1px;

    cursor: pointer;

    border-radius:
      47% 53% 48% 52%
      /
      55% 46% 54% 45%;

    box-shadow: 3px 4px 0 rgba(0,0,0,.15);

    transition:
      transform 180ms ease,
      background 180ms ease,
      color 180ms ease;
  }

  .menu-button:hover {
    transform:
      translateX(-50%)
      scale(1.06);
  }

  .product-wrap.active .menu-button {
    background: #111;
    color: #f3ede1;
  }


  /* ACTION BUTTONS */

  .action {
    position: absolute;

    left: 50%;
    bottom: 17px;

    width: 75px;
    height: 75px;

    margin-left: -37px;

    z-index: 30;

    display: grid;
    place-items: center;

    border: 1.7px solid #111;

    background: #f5efe3;
    color: #111;

    font-family: Georgia, serif;

    text-align: center;
    font-size: 10px;
    line-height: 1.15;

    text-transform: uppercase;
    letter-spacing: .6px;

    cursor: pointer;

    border-radius:
      49% 51% 44% 56%
      /
      56% 45% 55% 44%;

    box-shadow:
      3px 4px 0 rgba(0,0,0,.14);

    opacity: 0;
    pointer-events: none;

    transform:
      translate(0,0)
      scale(.25)
      rotate(-12deg);

    transition:
      transform 420ms cubic-bezier(.22, 1.6, .36, 1),
      opacity 140ms ease,
      background 150ms ease,
      color 150ms ease;
  }


  /* OPEN POSITIONS */

  .product-wrap.active .action {
    opacity: 1;
    pointer-events: auto;
  }

  .product-wrap.active .wishlist {
    transform:
      translate(-130px, -85px)
      rotate(-7deg);
  }

  .product-wrap.active .quickview {
    transform:
      translate(-45px, -140px)
      rotate(3deg);
  }

  .product-wrap.active .share {
    transform:
      translate(55px, -140px)
      rotate(-3deg);
  }

  .product-wrap.active .view {
    transform:
      translate(140px, -85px)
      rotate(6deg);
  }


  /* STAGGER */

  .wishlist {
    transition-delay: 0ms;
  }

  .quickview {
    transition-delay: 35ms;
  }

  .share {
    transition-delay: 70ms;
  }

  .view {
    transition-delay: 105ms;
  }


  /* ACTION HOVER */

  .product-wrap.active .action:hover {
    background: #111;
    color: #f5efe3;
    z-index: 60;
  }

  .product-wrap.active .wishlist:hover {
    transform:
      translate(-130px, -85px)
      scale(1.15)
      rotate(-2deg);
  }

  .product-wrap.active .quickview:hover {
    transform:
      translate(-45px, -140px)
      scale(1.15)
      rotate(-2deg);
  }

  .product-wrap.active .share:hover {
    transform:
      translate(55px, -140px)
      scale(1.15)
      rotate(2deg);
  }

  .product-wrap.active .view:hover {
    transform:
      translate(140px, -85px)
      scale(1.15)
      rotate(2deg);
  }


  .result {
    margin-top: 25px;
    height: 20px;
    text-align: center;
    font-size: 13px;
  }

</style>
</head>

<body>

<main class="page">

  <div class="title">
    Silver.Stone
  </div>


  <div class="product-wrap" id="productWrap">


    <!-- ACTIONS -->

    <button
      class="action wishlist"
      data-action="Wishlist"
    >
      ♡
      <br>
      Wishlist
    </button>


    <button
      class="action quickview"
      data-action="Quick View"
    >
      ◉
      <br>
      Quick
      <br>
      View
    </button>


    <button
      class="action share"
      data-action="Share"
    >
      ↗
      <br>
      Share
    </button>


    <button
      class="action view"
      data-action="View Piece"
    >
      →
      <br>
      View
      <br>
      Piece
    </button>



    <!-- PRODUCT -->

    <article class="product">

      <img
        src="https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=900&q=85"
        alt="Jewellery"
      />

      <div class="product-info">

        <div class="product-name">
          Blue Topaz
          <br>
          Signet
        </div>

        <div class="product-price">
          ₹12,500
        </div>

      </div>

    </article>


    <!-- MENU TRIGGER -->

    <button
      class="menu-button"
      id="menuButton"
      aria-expanded="false"
    >
      Menu +
    </button>

  </div>


  <div
    class="result"
    id="result"
  ></div>

</main>


<script>

const wrapper =
  document.querySelector("#productWrap");

const menuButton =
  document.querySelector("#menuButton");

const actions =
  document.querySelectorAll(".action");

const result =
  document.querySelector("#result");


/* MENU TOGGLE */

menuButton.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    const isOpen =
      wrapper.classList.toggle("active");

    menuButton.setAttribute(
      "aria-expanded",
      isOpen
    );

    menuButton.textContent =
      isOpen
        ? "Close ×"
        : "Menu +";

  }
);


/* ACTIONS */

actions.forEach(action => {

  action.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      const selected =
        action.dataset.action;

      result.textContent =
        `Selected: ${selected}`;

      closeMenu();

    }
  );

});


/* CLICK OUTSIDE CLOSES MENU */

document.addEventListener(
  "click",
  event => {

    if (
      !wrapper.contains(event.target)
    ) {
      closeMenu();
    }

  }
);


/* ESCAPE CLOSES MENU */

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "Escape") {
      closeMenu();
    }

  }
);


function closeMenu() {

  wrapper.classList.remove("active");

  menuButton.textContent =
    "Menu +";

  menuButton.setAttribute(
    "aria-expanded",
    "false"
  );

}

</script>

</body>
</html>
